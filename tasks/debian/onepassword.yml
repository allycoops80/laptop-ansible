---
# ── 1Password ─────────────────────────────────────────────────────────
- name: Download 1Password GPG key
  shell: |
    curl -sS https://downloads.1password.com/linux/keys/1password.asc \
      | gpg --dearmor > /usr/share/keyrings/1password-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/1password-archive-keyring.gpg

- name: Add 1Password apt repository
  copy:
    dest: /etc/apt/sources.list.d/1password.sources
    content: |
      Types: deb
      URIs: https://downloads.1password.com/linux/debian/amd64
      Suites: stable
      Components: main
      Architectures: amd64
      Signed-By: /usr/share/keyrings/1password-archive-keyring.gpg
    mode: "0644"

- name: Add 1Password debsig policy directory
  file:
    path: /etc/debsig/policies/AC2D62742012EA22
    state: directory
    mode: "0755"

- name: Download 1Password debsig policy
  get_url:
    url: https://downloads.1password.com/linux/debian/debsig/1password.pol
    dest: /etc/debsig/policies/AC2D62742012EA22/1password.pol
    mode: "0644"

- name: Add 1Password debsig keyring directory
  file:
    path: /usr/share/debsig/keyrings/AC2D62742012EA22
    state: directory
    mode: "0755"

- name: Download 1Password debsig keyring
  shell: |
    curl -sS https://downloads.1password.com/linux/keys/1password.asc \
      | gpg --dearmor > /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg
  args:
    creates: /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg

- name: Install 1Password desktop and CLI
  apt:
    name:
      - 1password
      - 1password-cli
    update_cache: true
    state: present
