---
# ── Obsidian ──────────────────────────────────────────────────────────
# No apt repo; fetch the latest .deb from GitHub releases. /releases/latest
# can point at an Android-only release with no .deb asset, so scan the
# recent releases for the newest one that has one.
- name: Get recent Obsidian releases metadata
  uri:
    url: https://api.github.com/repos/obsidianmd/obsidian-releases/releases?per_page=10
    headers:
      Accept: application/vnd.github.v3+json
    return_content: true
  register: obsidian_releases

- name: Resolve Obsidian deb download URL
  set_fact:
    obsidian_deb_url: >-
      {{ obsidian_releases.json
         | map(attribute='assets') | list | flatten
         | selectattr('name', 'match', 'obsidian_[0-9.]+_amd64\.deb$')
         | map(attribute='browser_download_url')
         | first }}

- name: Download Obsidian deb
  get_url:
    url: "{{ obsidian_deb_url }}"
    dest: /tmp/obsidian_amd64.deb
    mode: "0644"

- name: Install Obsidian
  apt:
    deb: /tmp/obsidian_amd64.deb
