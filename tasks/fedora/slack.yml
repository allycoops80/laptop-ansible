---
# ── Slack ─────────────────────────────────────────────────────────────
# Slack's packagecloud RPM repo is stale (last package from 2016) and
# publishes no usable el/7+ metadata, so install via Flathub instead.
- name: Ensure flatpak is installed
  dnf:
    name: flatpak
    state: present

- name: Add Flathub remote
  command: flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
  register: flathub_remote
  changed_when: "'already exists' not in (flathub_remote.stderr | default(''))"

- name: Install Slack (Flathub)
  command: flatpak install -y --noninteractive flathub com.slack.Slack
  register: slack_flatpak
  changed_when: "'already installed' not in slack_flatpak.stdout"
