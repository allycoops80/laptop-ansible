---
# ── Obsidian ──────────────────────────────────────────────────────────
# Obsidian no longer ships .rpm assets, and /releases/latest can point
# at an Android-only release with no desktop assets at all, so scan the
# recent releases for the newest one that has a Linux AppImage.
- name: Get recent Obsidian releases metadata
  uri:
    url: https://api.github.com/repos/obsidianmd/obsidian-releases/releases?per_page=10
    headers:
      Accept: application/vnd.github.v3+json
    return_content: true
  register: obsidian_releases

- name: Resolve latest Obsidian AppImage download URL
  set_fact:
    obsidian_appimage_url: >-
      {{ obsidian_releases.json
         | map(attribute='assets') | list | flatten
         | selectattr('name', 'match', 'Obsidian-[0-9.]+\.AppImage$')
         | map(attribute='browser_download_url')
         | first }}

- name: Ensure /opt/obsidian directory exists
  file:
    path: /opt/obsidian
    state: directory
    mode: "0755"

- name: Download Obsidian AppImage
  get_url:
    url: "{{ obsidian_appimage_url }}"
    dest: /opt/obsidian/Obsidian.AppImage
    mode: "0755"

- name: Symlink obsidian into PATH
  file:
    src: /opt/obsidian/Obsidian.AppImage
    dest: /usr/local/bin/obsidian
    state: link

- name: Install Obsidian desktop entry
  copy:
    dest: /usr/share/applications/obsidian.desktop
    content: |
      [Desktop Entry]
      Name=Obsidian
      Exec=/usr/local/bin/obsidian %u
      Terminal=false
      Type=Application
      Icon=obsidian
      StartupWMClass=obsidian
      Comment=Knowledge base
      MimeType=x-scheme-handler/obsidian;
      Categories=Office;
    mode: "0644"
