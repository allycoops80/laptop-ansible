---
# Bootstrap (one-time, on new laptop):
#   bash bootstrap.sh
# bootstrap.sh detects Debian/Ubuntu (apt) vs Fedora (dnf) to install git and
# ansible before cloning this repo and running the playbook.
#
# Run (pass the_user so sudo doesn't shadow $USER with root):
#   sudo ansible-playbook -i inventory.ini site.yml -e "the_user=$USER"
#   sudo ansible-playbook -i inventory.ini site.yml -e "the_user=$USER" --tags git,nodejs,vscode
#
# OS family (Debian/Ubuntu vs Fedora) is detected automatically at run time
# via the ansible_os_family fact — no extra variable needed. Per-app tasks
# live under tasks/debian/ and tasks/fedora/; see openspec/specs/
# workstation-provisioning for the behavior contract.

- name: Laptop developer tools
  hosts: local
  connection: local
  become: true

  vars:
    the_user: "{{ lookup('env','SUDO_USER') | default(lookup('env','USER'), true) }}"
    repos:
      # Traveltek
      - git@github.com:Traveltek/app-travelshops.git
      - git@github.com:Traveltek/aws-infrastructure-glasgow.git
      - git@github.com:Traveltek/aws-cost-management-resources.git
      - git@github.com:Traveltek/codename-london.git
      - git@github.com:Traveltek/config-aws-infrastructure.git
      - git@github.com:Traveltek/config-server-traveltek-eu1.git
      - git@github.com:Traveltek/config-userdata-org.git
      - git@github.com:Traveltek/devops-codebuild-automation.git
      - git@github.com:Traveltek/devops-tooling.git
      - git@github.com:Traveltek/claude-integrations.git
      - git@github.com:Traveltekv2/vervotech-sync.git
      # Personal
      - git@github.com:allycoops80/bedrock-support-agent.git
      - git@github.com:allycoops80/support-agent.git
      # Public
      - https://github.com/awslabs/aidlc-workflows.git

  pre_tasks:
    - name: Verify the_user is set correctly
      fail:
        msg: "the_user resolved to '{{ the_user }}' — run with: sudo ansible-playbook ... -e \"the_user=$USER\""
      when: the_user == 'root' or the_user == ''

    - name: Verify OS family is supported
      fail:
        msg: >-
          Unsupported OS family '{{ ansible_os_family }}' — this playbook only
          supports Debian/Ubuntu and Fedora.
      when: ansible_os_family not in ['Debian', 'Fedora']

    - name: Debian/Ubuntu prerequisites
      include_tasks: tasks/debian/prerequisites.yml
      when: ansible_os_family == "Debian"

    - name: Fedora prerequisites
      include_tasks: tasks/fedora/prerequisites.yml
      when: ansible_os_family == "Fedora"

  tasks:

    # ── Git ───────────────────────────────────────────────────────────────
    - name: Install git (Debian/Ubuntu)
      include_tasks: tasks/debian/git.yml
      when: ansible_os_family == "Debian"
      tags: git

    - name: Install git (Fedora)
      include_tasks: tasks/fedora/git.yml
      when: ansible_os_family == "Fedora"
      tags: git

    - name: Configure git identity
      community.general.git_config:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        scope: global
      become: true
      become_user: "{{ the_user }}"
      loop:
        - { name: user.name,  value: "Alan Cooper" }
        - { name: user.email, value: "alancooper@traveltek.net" }
      tags: git

    # ── GitHub CLI ───────────────────────────────────────────────────────
    - name: Install GitHub CLI (Debian/Ubuntu)
      include_tasks: tasks/debian/gh.yml
      when: ansible_os_family == "Debian"
      tags: gh

    - name: Install GitHub CLI (Fedora)
      include_tasks: tasks/fedora/gh.yml
      when: ansible_os_family == "Fedora"
      tags: gh

    # ── Python ───────────────────────────────────────────────────────────
    - name: Install Python tools (Debian/Ubuntu)
      include_tasks: tasks/debian/python.yml
      when: ansible_os_family == "Debian"
      tags: python

    - name: Install Python tools (Fedora)
      include_tasks: tasks/fedora/python.yml
      when: ansible_os_family == "Fedora"
      tags: python

    # ── Node.js ───────────────────────────────────────────────────────────
    - name: Install Node.js and npm (Debian/Ubuntu)
      include_tasks: tasks/debian/nodejs.yml
      when: ansible_os_family == "Debian"
      tags: nodejs

    - name: Install Node.js and npm (Fedora)
      include_tasks: tasks/fedora/nodejs.yml
      when: ansible_os_family == "Fedora"
      tags: nodejs

    # ── VS Code ───────────────────────────────────────────────────────────
    - name: Install VS Code (Debian/Ubuntu)
      include_tasks: tasks/debian/vscode.yml
      when: ansible_os_family == "Debian"
      tags: vscode

    - name: Install VS Code (Fedora)
      include_tasks: tasks/fedora/vscode.yml
      when: ansible_os_family == "Fedora"
      tags: vscode

    # ── Slack ─────────────────────────────────────────────────────────────
    - name: Install Slack (Debian/Ubuntu)
      include_tasks: tasks/debian/slack.yml
      when: ansible_os_family == "Debian"
      tags: slack

    - name: Install Slack (Fedora)
      include_tasks: tasks/fedora/slack.yml
      when: ansible_os_family == "Fedora"
      tags: slack

    # ── Claude Desktop ────────────────────────────────────────────────────
    # Unofficial Debian packaging: https://github.com/aaddrick/claude-desktop-debian
    # No Fedora equivalent exists from that source — intentionally skipped on
    # Fedora (see proposal.md / openspec/changes/add-fedora-support).
    - name: Install Claude Desktop (Debian/Ubuntu)
      include_tasks: tasks/debian/claude_desktop.yml
      when: ansible_os_family == "Debian"
      tags: claude_desktop

    # ── Zoom ──────────────────────────────────────────────────────────────
    - name: Install Zoom (Debian/Ubuntu)
      include_tasks: tasks/debian/zoom.yml
      when: ansible_os_family == "Debian"
      tags: zoom

    - name: Install Zoom (Fedora)
      include_tasks: tasks/fedora/zoom.yml
      when: ansible_os_family == "Fedora"
      tags: zoom

    # ── Brave Browser ─────────────────────────────────────────────────────
    - name: Install Brave Browser (Debian/Ubuntu)
      include_tasks: tasks/debian/brave.yml
      when: ansible_os_family == "Debian"
      tags: brave

    - name: Install Brave Browser (Fedora)
      include_tasks: tasks/fedora/brave.yml
      when: ansible_os_family == "Fedora"
      tags: brave

    # ── Obsidian ──────────────────────────────────────────────────────────
    - name: Install Obsidian (Debian/Ubuntu)
      include_tasks: tasks/debian/obsidian.yml
      when: ansible_os_family == "Debian"
      tags: obsidian

    - name: Install Obsidian (Fedora)
      include_tasks: tasks/fedora/obsidian.yml
      when: ansible_os_family == "Fedora"
      tags: obsidian

    # ── 1Password ─────────────────────────────────────────────────────────
    - name: Install 1Password (Debian/Ubuntu)
      include_tasks: tasks/debian/onepassword.yml
      when: ansible_os_family == "Debian"
      tags: onepassword

    - name: Install 1Password (Fedora)
      include_tasks: tasks/fedora/onepassword.yml
      when: ansible_os_family == "Fedora"
      tags: onepassword

    # ── 1Password SSH agent ────────────────────────────────────────────────
    # After install: open 1Password → Settings → Developer → SSH Agent → enable it,
    # then add SSH keys as "SSH Key" items in the vault.
    # 1Password creates the socket at ~/.1password/agent.sock when running.
    - name: Configure SSH to use 1Password agent socket
      become: true
      become_user: "{{ the_user }}"
      blockinfile:
        path: "/home/{{ the_user }}/.ssh/config"
        create: true
        mode: "0600"
        marker: "# {mark} ANSIBLE MANAGED — 1PASSWORD SSH AGENT"
        block: |
          Host *
            IdentityAgent ~/.1password/agent.sock
      tags: onepassword

    - name: Export SSH_AUTH_SOCK for 1Password agent in .bashrc
      become: true
      become_user: "{{ the_user }}"
      blockinfile:
        path: "/home/{{ the_user }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED — 1PASSWORD SSH AGENT"
        block: |
          export SSH_AUTH_SOCK="$HOME/.1password/agent.sock"
      tags: onepassword

    # ── OpenTofu ──────────────────────────────────────────────────────────
    - name: Install OpenTofu (Debian/Ubuntu)
      include_tasks: tasks/debian/tofu.yml
      when: ansible_os_family == "Debian"
      tags: tofu

    - name: Install OpenTofu (Fedora)
      include_tasks: tasks/fedora/tofu.yml
      when: ansible_os_family == "Fedora"
      tags: tofu

    # ── AWS CLI v2 ──────────────────────────────────────────────────────────
    - name: Install AWS CLI v2 (Debian/Ubuntu)
      include_tasks: tasks/debian/awscli.yml
      when: ansible_os_family == "Debian"
      tags: awscli

    - name: Install AWS CLI v2 (Fedora)
      include_tasks: tasks/fedora/awscli.yml
      when: ansible_os_family == "Fedora"
      tags: awscli

    # ── OpenVPN 3 ────────────────────────────────────────────────────────
    - name: Install OpenVPN 3 (Debian/Ubuntu)
      include_tasks: tasks/debian/openvpn3.yml
      when: ansible_os_family == "Debian"
      tags: openvpn3

    - name: Install OpenVPN 3 (Fedora)
      include_tasks: tasks/fedora/openvpn3.yml
      when: ansible_os_family == "Fedora"
      tags: openvpn3

    # ── AWS CDK ───────────────────────────────────────────────────────────
    - name: Install AWS CDK
      become: true
      become_user: "{{ the_user }}"
      npm:
        name: aws-cdk
        global: true
        state: latest
      environment:
        NPM_CONFIG_PREFIX: "/home/{{ the_user }}/.npm-global"
      tags: awscdk


    # ── Claude Code install ───────────────────────────────────────────────
    - name: Ensure per-user npm prefix exists
      become: true
      become_user: "{{ the_user }}"
      ansible.builtin.file:
        path: "/home/{{ the_user }}/.npm-global"
        state: directory
        mode: "0755"
      tags: claude_code

    - name: Fix ownership of ~/.npm cache (may be root-owned from earlier runs)
      file:
        path: "/home/{{ the_user }}/.npm"
        owner: "{{ the_user }}"
        group: "{{ the_user }}"
        recurse: true
        state: directory
      tags: claude_code

    - name: Install @anthropic-ai/claude-code globally (per-user)
      become: true
      become_user: "{{ the_user }}"
      community.general.npm:
        name: "@anthropic-ai/claude-code"
        global: true
        state: latest
      environment:
        NPM_CONFIG_PREFIX: "/home/{{ the_user }}/.npm-global"
      tags: claude_code

    - name: Ensure ~/.npm-global/bin is on PATH in .bashrc
      become: true
      become_user: "{{ the_user }}"
      ansible.builtin.lineinfile:
        path: "/home/{{ the_user }}/.bashrc"
        line: 'export PATH="$HOME/.npm-global/bin:$PATH"'
        regexp: '\.npm-global/bin'
        state: present
      tags: claude_code

    # ── Claude Code config ────────────────────────────────────────────────
    # config.json (API key) is intentionally excluded — set that manually.
    - name: Create ~/.claude directory
      become: true
      become_user: "{{ the_user }}"
      file:
        path: "/home/{{ the_user }}/.claude"
        state: directory
        mode: "0755"
      tags: claude_config

    - name: Copy Claude Code settings.json
      become: true
      become_user: "{{ the_user }}"
      copy:
        src: files/claude_settings.json
        dest: "/home/{{ the_user }}/.claude/settings.json"
        mode: "0644"
      tags: claude_config

    - name: Copy Claude Code settings.local.json
      become: true
      become_user: "{{ the_user }}"
      copy:
        src: files/claude_settings.local.json
        dest: "/home/{{ the_user }}/.claude/settings.local.json"
        mode: "0644"
      tags: claude_config

    # ── AWS config ────────────────────────────────────────────────────────
    # SSO-only config — no static credentials. After restore, authenticate
    # with: aws sso login --profile <profile>
    - name: Create ~/.aws directory
      become: true
      become_user: "{{ the_user }}"
      file:
        path: "/home/{{ the_user }}/.aws"
        state: directory
        mode: "0700"
      tags: aws

    - name: Copy AWS config
      become: true
      become_user: "{{ the_user }}"
      copy:
        src: files/aws_config
        dest: "/home/{{ the_user }}/.aws/config"
        mode: "0600"
      tags: aws

    # ── Claude Code CLI ───────────────────────────────────────────────────
    # Installs to npm global prefix (~/.npm-global); claude binary ends up in
    # ~/.npm-global/bin/ and self-links into ~/.local/share/claude/versions/.
    - name: Install Claude Code CLI
      npm:
        name: "@anthropic-ai/claude-code"
        global: true
      become: true
      become_user: "{{ the_user }}"
      environment:
        NPM_CONFIG_PREFIX: "/home/{{ the_user }}/.npm-global"
      tags: claude_code

    # ── AWS Session Manager Plugin ────────────────────────────────────────
    - name: Install AWS Session Manager plugin (Debian/Ubuntu)
      include_tasks: tasks/debian/ssm_plugin.yml
      when: ansible_os_family == "Debian"
      tags: ssm_plugin

    - name: Install AWS Session Manager plugin (Fedora)
      include_tasks: tasks/fedora/ssm_plugin.yml
      when: ansible_os_family == "Fedora"
      tags: ssm_plugin

    # ── NFS Mounts ───────────────────────────────────────────────────────
    - name: Configure NFS mounts (Debian/Ubuntu)
      include_tasks: tasks/debian/nfs.yml
      when: ansible_os_family == "Debian"
      tags: nfs

    - name: Configure NFS mounts (Fedora)
      include_tasks: tasks/fedora/nfs.yml
      when: ansible_os_family == "Fedora"
      tags: nfs

    # ── Repositories ──────────────────────────────────────────────────────
    # Requires 1Password SSH agent to be running and unlocked for SSH repos.
    # Run separately after completing 1Password setup:
    #   sudo -E ansible-playbook -i inventory.ini site.yml --tags repos
    - name: Create ~/code directory
      become: true
      become_user: "{{ the_user }}"
      file:
        path: "/home/{{ the_user }}/code"
        state: directory
        mode: "0755"
      tags: repos

    - name: Clone repositories
      become: true
      become_user: "{{ the_user }}"
      git:
        repo: "{{ item }}"
        dest: "/home/{{ the_user }}/code/{{ item | regex_replace('.*/', '') | regex_replace('\\.git$', '') }}"
        clone: true
        update: false
      loop: "{{ repos }}"
      tags: repos

    - name: Set laptop-ansible remote to SSH
      become: true
      become_user: "{{ the_user }}"
      community.general.git_config:
        name: remote.origin.url
        value: git@github.com:allycoops80/laptop-ansible.git
        scope: local
        repo: "/home/{{ the_user }}/code/laptop-ansible"
      tags: repos
